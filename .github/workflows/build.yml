name: Build IM Proxy
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache OpenCV
      id: cache-opencv
      uses: actions/cache@v4
      with:
        path: opencv
        key: opencv-4.8.0-android

    - name: Download OpenCV
      if: steps.cache-opencv.outputs.cache-hit != 'true'
      run: |
        wget -q https://github.com/opencv/opencv/releases/download/4.8.0/opencv-4.8.0-android-sdk.zip
        unzip -q opencv-4.8.0-android-sdk.zip -d opencv

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant Gradle execute
      run: chmod +x gradlew || true

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon

    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      id: sign
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: IMProxy-APK
        path: app/build/outputs/apk/release/*-signed.apk
